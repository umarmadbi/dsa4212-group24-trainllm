# E05 (D30) CONDITIONAL fairness run: AdamW N49 (exactly E02-N49 except the LR) for 60 min, seed 0. Launched ONLY if
# Muon's horizon check is contradicted, so that both optimisers end with a 60-min-checked LR (summarize.py E05 says when).
run_id: E05-N49_adamw_lr4e-3_60min
experiment: E05
corpus: fineweb_edu
eval_corpora: [fineweb_edu, fineweb, dclm, wikipedia]
n_layer: 11
n_head: 9
n_embd: 576
block_size: 512
vocab_size: 8192
micro_batch: 32
grad_accum: 2               # 32,768 tokens per step (DECLARATIONS Amendments 2026-11-01)
lr: 4.0e-03
min_lr_ratio: 0.1
warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
budget_s: 3600
eval_every_frac: 0.05
ckpt_every_s: 600
compile: true
dtype: bfloat16
