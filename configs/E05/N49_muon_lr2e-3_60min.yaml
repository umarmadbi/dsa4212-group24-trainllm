# E05 (D28, revised D30) 60-MIN RUN under the declared budget: N49 with Muon on the hidden block matrices (AdamW
# at 2e-3 for embeddings + LayerNorm). One file per Muon LR, so no placeholder has to be edited: the pilots
# pick the LR (python code/summarize.py E05 prints which files to launch: the pick with seeds 0-2 = final runs,
# and the D07 horizon-check LR(s) with seed 0). Compared with E02-N49 seeds 0-2 (AdamW). Rules: docs/experiments/E05_muon.md.
run_id: E05-N49_muon_lr2e-3_60min
experiment: E05
corpus: fineweb_edu
optimizer: muon
muon_lr: 2.0e-03                   # the Muon LR of this final/horizon run
eval_corpora: [fineweb_edu, fineweb, dclm, wikipedia]
n_layer: 11
n_head: 9
n_embd: 576
block_size: 512
vocab_size: 8192
micro_batch: 32
grad_accum: 2               # 32,768 tokens per step (DECLARATIONS Amendments 2026-11-01)
lr: 2.0e-03
min_lr_ratio: 0.1
warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
budget_s: 3600
eval_every_frac: 0.05
ckpt_every_s: 600
compile: true
dtype: bfloat16
