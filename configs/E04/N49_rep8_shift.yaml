# E04 follow-up F3 (D26, declared before its run): is the damage from repetition caused by showing the model the
# IDENTICAL 513-token windows every pass? Same subset and model as configs/E04/N49_rep8.yaml, but the window
# boundaries move every pass (train_subset_shift; seams between subset windows marked by EOT). Rules: E04 doc.
run_id: E04-N49_rep8_shift
experiment: E04
corpus: fineweb_edu
train_subset_tokens: 36250000    # same subset as N49_rep8 (~8 passes)
train_subset_shift: true         # window boundaries move every pass (ShiftedSubsetLoader, D26)
eval_corpora: [fineweb_edu, fineweb, dclm, wikipedia]   # headline = first (FineWeb-Edu val); others scored after training, outside the budget (D18)
n_layer: 11
n_head: 9
n_embd: 576
block_size: 512
vocab_size: 8192
micro_batch: 32
grad_accum: 2               # 32,768 tokens per step (DECLARATIONS Amendments 2026-11-01)
lr: 2.0e-03                 # E01 pick for this size
min_lr_ratio: 0.1
warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
budget_s: 3600              # declared budget: 60 counted minutes
eval_every_frac: 0.05
ckpt_every_s: 600           # ~10 min, as declared (section 1)
compile: true
dtype: bfloat16
