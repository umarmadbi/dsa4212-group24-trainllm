# E04 follow-up F2 (D26, declared before its runs): which model size is best when unique data is LIMITED?
# Same 36,250,000-token random nested subset as configs/E04/N49_rep8.yaml (key 1234), 60 min, this size at its
# E01 learning rate. Compared with E04-N49_rep8 seed 0 (N49 reads it ~8 times). Rules: docs/experiments/E04.
run_id: E04-N26_U36M
experiment: E04
corpus: fineweb_edu
train_subset_tokens: 36250000    # same subset as N49_rep8 (N26 reads it ~14 times in 60 min)
eval_corpora: [fineweb_edu, fineweb, dclm, wikipedia]   # headline = first (FineWeb-Edu val); others scored after training, outside the budget (D18)
n_layer: 9
n_head: 7
n_embd: 448
block_size: 512
vocab_size: 8192
micro_batch: 32
grad_accum: 2               # 32,768 tokens per step (DECLARATIONS Amendments 2026-11-01)
lr: 4.0e-03                 # E01 pick for this size
min_lr_ratio: 0.1
warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
budget_s: 3600              # declared budget: 60 counted minutes
eval_every_frac: 0.05
ckpt_every_s: 600           # ~10 min, as declared (section 1)
compile: true
dtype: bfloat16
