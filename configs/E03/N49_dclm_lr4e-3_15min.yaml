# E03 rule R6 (D25): learning-rate fairness check (15-min pilot; preliminary work, excluded from the
# per-run budget). N49's LR (2e-3) was tuned on FineWeb-Edu only (E01: 2e-3 beat 4e-3, 3-seed means).
# This pilot trains N49 on DCLM at 4e-3; together with its 2e-3/4e-3 partner it checks the ranking
# also holds on this corpus. Inconsistent if 4e-3 is lower than 2e-3 on this corpus's own validation
# split by > 2.8 sigma15 (0.0188); then this arm is also run at 4e-3 for 60 min (seed 0) as a sensitivity.
# Same settings as configs/E01/N49_lr4e-3.yaml except corpus and eval_corpora.
run_id: E03-N49_dclm_lr4e-3_15min
experiment: E03
corpus: dclm
eval_corpora: [fineweb_edu, fineweb, dclm, wikipedia]   # R6 reads the own-corpus set by name
n_layer: 11
n_head: 9
n_embd: 576
block_size: 512
vocab_size: 8192
micro_batch: 32
grad_accum: 2               # 32,768 tokens per step (DECLARATIONS Amendments 2026-11-01)
lr: 4.0e-03
min_lr_ratio: 0.1
warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
budget_s: 900               # 15 min; the time-based schedule is compressed to 15 min
eval_every_frac: 0.05
ckpt_every_s: 300
compile: true
dtype: bfloat16
