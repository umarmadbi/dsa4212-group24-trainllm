# E02 EDGE SIZE (rule P2, D17): launched ONLY if N7 (the smallest size) wins the size comparison.
# Its LR is NOT tuned: it takes the LR of its neighbour (2e-3); disclosed as a limitation.
run_id: E02-N4
experiment: E02
corpus: fineweb_edu
eval_corpora: [fineweb_edu, fineweb, dclm, wikipedia]   # headline = first (FineWeb-Edu val); others scored after training, outside the budget (D18)
n_layer: 5
n_head: 3
n_embd: 192
block_size: 512
vocab_size: 8192
micro_batch: 32
grad_accum: 2               # 32,768 tokens per step (DECLARATIONS Amendments 2026-11-01)
lr: 2.0e-03
min_lr_ratio: 0.1
warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
budget_s: 3600              # declared budget: 60 counted minutes
eval_every_frac: 0.05
ckpt_every_s: 600           # ~10 min, as declared (section 1)
compile: true
dtype: bfloat16
