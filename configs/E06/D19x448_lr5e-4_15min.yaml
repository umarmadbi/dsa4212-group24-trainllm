# E06 (D28, revised D30) learning-rate pilot for shape 19 layers x 448 wide (~49M params, same as N49 11x576). Preliminary work.
# Declared protocol (D30): 4 LRs 5e-4..4e-3 x 15 min, as every size had in E01; edge and close-call rules. Rule: docs/experiments/E06_depth_width.md.
run_id: E06-D19x448_lr5e-4_15min
experiment: E06
corpus: fineweb_edu

n_layer: 19
n_head: 7
n_embd: 448
block_size: 512
vocab_size: 8192
micro_batch: 32
grad_accum: 2               # 32,768 tokens per step (DECLARATIONS Amendments 2026-11-01)
lr: 5.0e-04
min_lr_ratio: 0.1
warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
budget_s: 900
eval_every_frac: 0.05
ckpt_every_s: 300
compile: true
dtype: bfloat16
