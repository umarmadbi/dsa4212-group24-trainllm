# E08 (D42) 60-MIN RUN under the declared budget, RA (full recipe: Muon + 6x768 + 16k).
# One file per Muon LR (no placeholder): `python code/summarize.py E08` prints which file to launch (the R1 pick,
# seeds 0, 1, 2). Compared with E02-N49 (baseline), E05 (Muon), E07 16k and the other recipe. Rules: D42.
run_id: E08-W6x768_V16384_muon_lr2.5e-4_60min
experiment: E08
corpus: fineweb_edu
data_variant: v16384
optimizer: muon
muon_lr: 2.5e-04               # Muon LR (hidden block matrices); the value tuned by R1
eval_corpora: [fineweb_edu, fineweb, dclm, wikipedia]   # headline = first; others scored after training (D18)
n_layer: 6
n_head: 12
n_embd: 768
block_size: 512
vocab_size: 16384
micro_batch: 32
grad_accum: 2               # 32,768 tokens per step (DECLARATIONS Amendments 2026-11-01)
lr: 2.0e-03                   # AdamW part (tied embedding/output, position embedding, LayerNorm); 2e-3 as E05
min_lr_ratio: 0.1
warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
budget_s: 3600
eval_every_frac: 0.05
ckpt_every_s: 600
compile: true
dtype: bfloat16
