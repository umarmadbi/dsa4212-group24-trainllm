# E01 learning-rate pilot (preliminary work, excluded from the per-run budget).
# Purpose: find the best peak learning rate for size N7 (6 layers x 256 wide), so the
# Phase 2 size comparison uses a well-tuned learning rate for every size (equal tuning effort:
# 4 rates, factor 2 apart, 15 min each; DECLARATIONS.md section 1).
# Selection: lowest final val BPB on the full FineWeb-Edu validation split.
run_id: E01-N7_lr1e-3
experiment: E01
corpus: fineweb_edu
n_layer: 6
n_head: 4
n_embd: 256
block_size: 512
vocab_size: 8192
micro_batch: 32
grad_accum: 2               # 32,768 tokens per step (DECLARATIONS Amendments 2026-11-01)
lr: 1.0e-03
min_lr_ratio: 0.1
warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
budget_s: 900               # 15 min; the time-based schedule is compressed to 15 min
eval_every_frac: 0.05
ckpt_every_s: 300
compile: true
dtype: bfloat16
